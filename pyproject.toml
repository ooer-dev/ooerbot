[project]
name = "ooerbot"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "ably~=3.1.4",
    "aiohttp~=3.14.5",
    "discord-py~=2.7.1",
    "pydantic~=2.14.4",
    "pydantic-settings~=2.16.3",
]

[tool.uv]
add-bounds = "major"

[dependency-groups]
dev = [
    "mypy>=2.4.1,<3.0.0",
    "ruff>=0.17.6,<0.18.0",
]

[tool.ruff.lint]
select = ["F", "W", "E", "C90", "I", "S", "B", "A", "C4", "Q"]
ignore = ["S101", "S311"]

[tool.mypy]
plugins = [
    "pydantic.mypy"
]
files = "."
python_version = "3.13"
platform = "linux"
strict = true

[[tool.mypy.overrides]]
module = "ably.*"
ignore_missing_imports = true
